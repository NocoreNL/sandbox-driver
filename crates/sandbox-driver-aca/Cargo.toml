[package]
name = "sandbox-driver-aca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Azure Container Apps sandbox provider for sandbox-driver"

[[bin]]
name = "sandbox-driver-aca"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
azure_core = "1.1.0"
azure_identity = "1.0.0"
base64.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
sandbox-driver.workspace = true
sandbox-driver-protocol = { path = "../sandbox-driver-protocol" }
sandbox-driver-aca-config = { path = "../sandbox-driver-aca-config" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "process", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sandbox-driver-conformance.workspace = true
sandbox-driver-testing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
